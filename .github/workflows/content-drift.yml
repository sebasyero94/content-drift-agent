name: Content Drift Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "mock-site/**"

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run the agent and post the report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python -m agent.main --pr "${{ github.event.pull_request.html_url }}" --post
